name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      # Tests marked `data` need the originals in data/original/ and are
      # excluded by the default addopts in pyproject.toml. They are not run
      # here: the third-party originals are not yet cleared for redistribution,
      # so a runner cannot fetch them. Re-enable the job below once
      # `permission` in the manifest reads `granted`.
      - name: Test
        run: pytest -q

  test-with-data:
    # Disabled until the suppliers have agreed to redistribution. Until then
    # `python -m gia_mip.data` refuses to download, and this job would fail on
    # every push. Run the same command locally, where the originals exist.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Fetch the benchmark originals
        run: python -m gia_mip.data --collection benchmarks
      - name: Test with data
        run: pytest -q -m data
