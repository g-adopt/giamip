name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      # Tests marked `data` need the originals and run in the job below.
      - name: Test
        run: pytest -q

  test-with-data:
    # Every original (Martinec, Spada and the GIAMIP inputs) is public at
    # https://data.gadopt.org/gia-mip/, so the runner downloads them over HTTPS
    # with no secret. Credentials for the object store are needed only to
    # upload, which is done by hand with scripts/upload_originals.py. Other
    # collections join this job when their permission in the manifest reads
    # `granted`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Fetch the granted originals
        run: python -m gia_mip.data --collection martinec2018 --collection spada2011 --collection giamip
      - name: Test with data
        run: pytest -q -m data
