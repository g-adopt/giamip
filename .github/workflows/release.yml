name: Release

# Publish gia-mip to PyPI when a version tag is pushed, for example v0.1.0.
#
# PyPI trusted publishing: PyPI trusts this repository's workflow through
# OpenID Connect, so there is no API token anywhere. Configure it once on PyPI
# for the project gia-mip: owner g-adopt, repository gia-mip, workflow
# release.yml, environment pypi.
#
# The version is `gia_mip.__version__` (pyproject.toml reads it). The tag must
# be "v" followed by that version, and the build job stops when it is not.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          pip install build
          python -m build
      - name: Check that the tag is the package version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, '.'); import gia_mip; print(gia_mip.__version__)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1
          fi
      - name: List the contents
        run: |
          unzip -l dist/*.whl
          tar tzf dist/*.tar.gz
      - name: Install the wheel into a new virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
      - name: Check the installed wheel against the real store
        # --all-converted locates every converted file of the manifest on
        # data.gadopt.org, so a release whose data was never uploaded stops
        # here.
        working-directory: ${{ runner.temp }}
        env:
          GIA_MIP_DATA_ROOT: ${{ runner.temp }}/gia-mip-data
        run: >
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed.py"
          --all-converted
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
