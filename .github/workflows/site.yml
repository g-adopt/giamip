name: Render site

on:
  push:
    branches: [main]
  workflow_dispatch:

# The site is split in two. The light job renders every page that needs only
# `data/converted/`, which is a few megabytes. Pages that need the 320 MB
# GIAMIP inputs or a solver run are frozen by Quarto, so this job rebuilds
# their HTML from the committed cache and executes nothing.
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install
        run: pip install -e ".[docs]"
      - name: Fetch the converted reference data
        run: python -m gia_mip.data --group converted
      - name: Render
        run: quarto render
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
