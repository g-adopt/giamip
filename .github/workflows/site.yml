name: Render site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes in quick succession would otherwise race to deploy, and the
# loser can overwrite the winner. Deployments are not cancelled in flight.
concurrency:
  group: pages
  cancel-in-progress: false

# One job. Every page needs nothing beyond the tracked files, the
# `data/converted/` reference data included. `_freeze/` is gitignored, so the
# runner has no execution cache and Quarto executes every page. A new page
# whose code needs the third-party originals therefore fails here, on the
# missing files.
#
# The pages of single tests in docs/cases/ are Python files that Quarto renders
# directly, as a page and as an executed notebook. The Test workflow executes
# the same pages through tests/test_pages.py.
jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install
        run: pip install -e ".[docs]"
      - name: Render
        run: quarto render
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
