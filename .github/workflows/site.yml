name: Render site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One job. Every page either needs nothing beyond the tracked `data/converted/`
# reference data, or carries a committed `_freeze/` cache made on a machine
# that had the originals. Nothing here fetches the 317 MB of GIAMIP input and
# nothing here runs a solver, so `execute: freeze: true` in _quarto.yml is what
# keeps this job honest: a page without a cache fails loudly instead of
# quietly executing.
jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install
        run: pip install -e ".[docs]"
      - name: Render
        run: quarto render
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
