project:
  type: website
  output-dir: _site
  # An explicit list, never the default sweep. Quarto renders every .qmd and
  # .md it finds and does not read .gitignore, so the default would publish
  # NOTES/, which is a private working record, together with AGENTS.md and
  # LICENSE-DATA.md. Anything added to docs/ is picked up; anything outside it
  # has to be named here.
  render:
    - index.qmd
    - docs/**/*.qmd
    # The pages for single tests, written as percent-format Python files.
    # Quarto renders each one as a page and as an executed notebook. The
    # settings are in docs/cases/_metadata.yml, and CONTRIBUTING.md describes
    # how to add a page.
    - docs/cases/**/*.py

# `freeze: true` makes a local render reuse the `_freeze/` cache of a page that
# has one, so that a second render does not execute every page again.
# `_freeze/` is gitignored, so a CI runner has no cache and executes every
# page. Every page reads only tracked files, which is what lets it execute
# there. A page that needs the 317 MB of GIAMIP input or a solver run cannot
# execute on a runner.
#
# The pages under docs/cases/ execute on every render, local renders included.
# docs/cases/_metadata.yml turns freeze off for them, so that their figures
# always come from the current code. They execute in seconds.
execute:
  freeze: true

website:
  title: "GIA model comparison"
  description: "Case definitions, reference data and output conventions for the Spada (2011) and Martinec (2018) GIA benchmarks and for GIAMIP."
  repo-url: https://github.com/g-adopt/gia-mip
  repo-actions: [issue, source]
