project:
  type: website
  output-dir: _site
  # An explicit list, never the default sweep. Quarto renders every .qmd and
  # .md it finds and does not read .gitignore, so the default would publish
  # NOTES/, which is a private working record, together with AGENTS.md and
  # LICENSE-DATA.md. Anything added to docs/ is picked up; anything outside it
  # has to be named here.
  render:
    - index.qmd
    - docs/**/*.qmd

# `freeze: true` and not `auto`. `auto` re-executes a page whenever its source
# changes, which is exactly the case this is meant to prevent: a page that
# needs the 317 MB of GIAMIP input or a solver run must never execute on a
# GitHub runner. Pages are re-executed on a machine that has the data, with
# `quarto render --no-freeze`, and the resulting `_freeze/` cache is committed.
execute:
  freeze: true

website:
  title: "GIA model comparison"
  description: "Case definitions, reference data and output conventions for the Spada (2011) and Martinec (2018) GIA benchmarks and for GIAMIP."
  repo-url: https://github.com/g-adopt/gia-mip
  repo-actions: [issue, source]
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Collections"
        menu:
          - docs/collections/spada2011.qmd
          - docs/collections/martinec2018.qmd
          - docs/collections/giamip.qmd
      - text: "Reference"
        menu:
          - docs/reference/solver-requirements.qmd
          - docs/reference/conventions.qmd
          - docs/reference/earth-models.qmd
          - docs/reference/loads-and-grids.qmd
          - docs/reference/codes-and-contributors.qmd
          - docs/reference/column-layouts.qmd
          - docs/reference/python-interface.qmd
      - text: "Cases"
        href: docs/results/index.qmd
      - text: "Data"
        menu:
          - docs/data/fetching.qmd
          - docs/data/manifest.qmd
          - docs/data/corrections.qmd
      - text: "Protocol"
        menu:
          - docs/protocol/giamip-v2.4.qmd
          - docs/protocol/martinec2018.qmd

format:
  html:
    theme: cosmo
    toc: true
    # Code is content here: the point of the site is to show what to run.
    code-fold: false
